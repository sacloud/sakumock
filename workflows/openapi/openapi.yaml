                  type: string
                  minLength: 0
                  maxLength: 64
                  pattern: ^[a-zA-Z0-9_\-ーぁ-んァ-ヶ一-龠]*$
                ServicePrincipalId:
                  oneOf:
                    - type: string
                      pattern: ^[0-9]{12}$
                    - type: number
                ConcurrencyMode:
                  type: string
                  enum:
                    - parallel
                    - lock
                    - queue
              required:
                - Name
                - Runbook
                - Publish
                - Logging
            example:
              Name: sampleString
              Description: sampleString
              Runbook: sampleString
              Publish: true
              Logging: true
              Tags:
                - Name: sampleString
              RevisionAlias: sampleString
              ServicePrincipalId: sampleString
              ConcurrencyMode: parallel
      responses:
        "201":
          description: ワークフローの作成に成功した
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_ok:
                    type: boolean
                  Workflow:
                    type: object
                    properties:
                      Id:
                        type: string
                        minLength: 1
                        maxLength: 36
                      Name:
                        type: string
                        minLength: 1
                        maxLength: 64
                        pattern: ^[a-zA-Z0-9_\-ーぁ-んァ-ヶ一-龠]+$
                      Description:
                        type: string
                        minLength: 0
                        maxLength: 1024
                      Publish:
                        type: boolean
                      Logging:
                        type: boolean
                      Tags:
                        type: array
                        items:
                          type: object
                          properties:
                            Name:
                              type: string
                              minLength: 1
                              maxLength: 64
                          required:
                            - Name
                      ServicePrincipalId:
                        oneOf:
                          - type: string
                            pattern: ^[0-9]{12}$
                          - type: number
                      CreatedAt:
                        type: string
                        format: date-time
                      UpdatedAt:
                        type: string
                        format: date-time
                      ConcurrencyMode:
                        type: string
                        enum:
                          - parallel
                          - lock
                          - queue
                    required:
                      - Id
                      - Name
                      - Publish
                      - Logging
                      - Tags
                      - CreatedAt
                      - UpdatedAt
                required:
                  - is_ok
                  - Workflow
              example:
                is_ok: true
                Workflow:
                  Id: sampleString
                  Name: sampleString
                  Description: sampleString
                  Publish: true
                  Logging: true
                  Tags:
                    - Name: sampleString
                  ServicePrincipalId: sampleString
                  CreatedAt: 2020-01-01T00:00:00Z
                  UpdatedAt: 2020-01-01T00:00:00Z
                  ConcurrencyMode: parallel
        "400": &a1
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_ok:
                    default: false
                    type: boolean
                  Message:
                    type: string
                required:
                  - is_ok
                  - Message
