        - timeoutSeconds
      properties:
        path:
          type: string
          maxLength: 200
          description: ヘルスチェックのパス（HTTP の場合）
          example: /healthz
        intervalSeconds:
          type: integer
          format: int32
          minimum: 3
          maximum: 60
          description: ヘルスチェックの間隔（秒）
          default: 30
        timeoutSeconds:
          type: integer
          format: int32
          maximum: 60
          description: ヘルスチェックのタイムアウト（秒）
          default: 5
