paths:
  /applications:
    post:
      operationId: createApplication
      summary: 新しいアプリケーションの作成
      description: 指定したクラスタに新しいアプリケーションを作成します。1アカウントにつき最大10個まで作成可能です。
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApplicationResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
    get:
      operationId: listApplications
      summary: アカウント内のアプリケーションの一覧を取得
      description: 指定したアカウントに紐づくアプリケーションの一覧を返します。
      parameters:
        - name: clusterID
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ClusterID'
          explode: false
        - name: cursor
          in: query
          required: false
          description: 前ページの最後のID。これ以降のデータを取得するためのカーソル。ページネーションに利用します。
          schema:
            $ref: '#/components/schemas/ApplicationID'
          explode: false
        - name: maxItems
          in: query
          required: true
          description: 1ページあたりの最大取得件数。
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 30
            default: 20
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListApplicationsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - application
  /applications/{applicationID}:
    get:
      operationId: readApplication
      summary: アプリケーションの詳細を取得
      description: 指定したアプリケーションIDの詳細を返します。
      parameters:
        - name: applicationID
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ApplicationID'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadApplicationResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - application
    put:
      operationId: updateApplication
      summary: アプリケーション情報の更新
      description: アプリケーションのactiveVersionなどを更新します。クラスタの変更はできません。activeVersionを変更すると指定したバージョンがデプロイされます。activeVersionをnullにするとアプリケーションは非アクティブ状態になり、デプロイされなくなります。アプリケーション削除前にはactiveVersionをnullにする必要があります。
      parameters:
        - name: applicationID
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ApplicationID'
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationRequest'
    delete:
      operationId: deleteApplication
      summary: アプリケーションの削除
      description: |-
        指定したアプリケーションを削除します。

        ## 前提条件

        - 当該アプリケーションに **アクティブなバージョンが存在しない** こと
        - いずれのワーカノードでも当該アプリケーションの **コンテナが稼働していない** こと
      parameters:
        - name: applicationID
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ApplicationID'
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - application
