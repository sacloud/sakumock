security:
  - BasicAuth: []
components:
  schemas:
    ActionDefinition:
      type: object
      oneOf:
        - $ref: '#/components/schemas/ActionDefinitionSimpleNotification'
        - $ref: '#/components/schemas/ActionDefinitionWorkflows'
      discriminator:
        propertyName: actionType
        mapping:
          simpleNotification: '#/components/schemas/ActionDefinitionSimpleNotification'
          workflows: '#/components/schemas/ActionDefinitionWorkflows'
    ActionDefinitionSimpleNotification:
      type: object
      required:
        - actionType
        - actionParameter
      properties:
        actionType:
          type: string
          enum:
            - simpleNotification
        actionParameter:
          $ref: '#/components/schemas/SakuraSimpleNotification'
    ActionDefinitionWorkflows:
      type: object
      required:
        - actionType
        - actionParameter
      properties:
        actionType:
          type: string
          enum:
            - workflows
        actionParameter:
          $ref: '#/components/schemas/SakuraWorkflows'
    ActivationCreateInput:
      type: object
      required:
        - servicePrincipalId
      properties:
        servicePrincipalId:
          type: string
          description: プロジェクトに紐づくサービスプリンシパルID（評価対象リソースへのアクセス権限付与）。
      description: 新規プロジェクトのセキュリティコントロール有効化時に使用するリクエストボディ。
    ActivationOutput:
      type: object
      required:
        - servicePrincipalId
        - isActive
        - automatedActionLimit
      properties:
        servicePrincipalId:
          type: string
          description: プロジェクトに紐づくサービスプリンシパルID（評価対象リソースへのアクセス権限付与）。
        isActive:
          type: boolean
          description: 現在のプロジェクトで「セキュリティコントロール」が有効かどうか。
        automatedActionLimit:
          type: integer
          description: 登録可能な自動アクションの最大数。
          readOnly: true
      description: |-
        現在のプロジェクトにおける「セキュリティコントロール」有効化状態を返すレスポンスボディ。

        基本情報に加えて、システム内部で定義された追加情報を含む。
    ActivationUpdateInput:
      type: object
      required:
        - servicePrincipalId
        - isActive
      properties:
        servicePrincipalId:
          type: string
          description: プロジェクトに紐づくサービスプリンシパルID（評価対象リソースへのアクセス権限付与）。
        isActive:
          type: boolean
          description: 現在のプロジェクトで「セキュリティコントロール」が有効かどうか。
      description: 有効化状態更新時のリクエストボディ
    AddonDatalakeNoPublicAccess:
      type: object
      required:
        - evaluationRuleId
      properties:
        evaluationRuleId:
          type: string
          enum:
            - addon-datalake-no-public-access
