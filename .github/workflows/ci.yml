name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go-version: ["1.26", "1.27"]
        # One Windows leg — the release ships Windows binaries, so unit tests
        # must pass there too. The full Go version matrix stays on Linux.
        include:
          - os: windows-latest
            go-version: "1.26"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -v ./...

  generated-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      # Regenerate validate_gen.go from the committed openapi/ specs and fail
      # if the committed generated files are stale.
      - name: Generate
        run: go generate ./...
      - name: Check for diff
        run: git diff --exit-code

  terraform-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      # terraform_wrapper must be off so the test sees terraform's real exit
      # codes (e.g. `plan -detailed-exitcode` returning 2 for a diff).
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      # Drives `sakumock all` with the sacloud/sakura provider end to end. The
      # provider is fetched from the Terraform Registry, so this job needs network.
      - name: Terraform end-to-end test
        run: go test -tags terraform -v ./test/terraform/
