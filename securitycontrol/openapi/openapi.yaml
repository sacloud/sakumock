      summary: 評価ルール一覧の取得
      description: |-
        プロジェクトの評価ルール一覧を取得します。

        pageSizeの最大値は100。100を超える値は100として扱う。
        pageSize未指定時は50。
      parameters:
        - name: page_size
          in: query
          required: false
          description: |-
            返却する要素の最大数。

            サービス側でこの値より少なく返す場合がある。
          schema:
            type: integer
          explode: false
        - name: next
          in: query
          required: false
          description: |-
            このページトークンより後の要素を取得する。

            このフィールドと `prev` は同時に指定できない。

            ページネーション時、他のリクエストパラメータは元のリクエストと一致している必要がある。
            無効な場合は400 Bad Requestとなる。
          schema:
            type: string
          explode: false
        - name: prev
          in: query
          required: false
          description: |-
            このページトークンより前の要素を取得する。

            このフィールドと `next` は同時に指定できない。

            ページネーション時、他のリクエストパラメータは元のリクエストと一致している必要がある。
            無効な場合は400 Bad Requestとなる。
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EvaluationRule'
                  nextPageToken:
                    type: string
                    description: |-
                      次ページ取得用のトークン。

                      このフィールドが省略されている場合は次ページなし。
                      次のページを取得するには、この値を次のリクエストの `next` に指定する。
                  prevPageToken:
                    type: string
                    description: |-
                      前ページ取得用のトークン。

                      このフィールドが省略されている場合は前ページなし。
                      前のページを取得するには、この値を次のリクエストの `prev` に指定する。
                  totalSize:
                    type: integer
                    description: |-
                      ページネーション対象リストの全アイテム数。

                      この値は推定値である可能性がある。
                required:
                  - items
                  - totalSize
        '400':
          description: サーバーがリクエストのパラメータやペイロードを理解できなかった場合のエラー。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequest'
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: |-
            認証が必要なリクエスト。
            ユーザーが認証されていない、または認証トークンが無効な場合に返されるエラー。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: |-
            サーバーがリクエストを理解したが認可を拒否した場合のエラー。
            ユーザーにリソースへのアクセス権限がない場合に返される。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Forbidden'
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: |-
            リクエストされたリソースが見つからない場合のエラー。
            リソースが存在しない、またはアクセスできない場合に返される。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFound'
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '429':
          description: |-
            クライアントが一定期間内に過剰なリクエストを送信した場合のエラー。

            レートリミットに達した場合に返される。
          headers:
            Retry-After:
              required: false
              description: クライアントが再試行するまでにどれぐらい待つべきかを示す。
              schema:
                anyOf:
                  - $ref: '#/components/schemas/clientDelaySeconds'
                  - $ref: '#/components/schemas/clientRetryDateTime'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
        default:
          description: An unexpected error response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnexpectedError'
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedError'
      tags:
        - 評価ルール
