openapi: 3.1.0
info:
  title: Service Endpoint Gateway API
  version: 1.2.2
  contact:
    name: SAKURA internet Inc.
    url: https://www.sakura.ad.jp/
  license:
    name: Copyright(C) SAKURA internet Inc. all rights reserved.
  description: |-
    ---
    「サービスエンドポイントゲートウェイ」が提供するAPIの利用方法とサンプルを公開しております。
    # 基本的な使い方
    ## APIキーの発行
    APIを利用するためには、認証のための「APIキー」が必要です。事前にキーを発行しておきます。
    APIキーは「ユーザID」「パスワード」に相当する「トークン」と呼ばれる認証情報で構成されています。
    |   項目名   | APIキー発行時の項目名        | このドキュメント内での例             |
    |------------|------------------------------|--------------------------------------|
    | ユーザID | アクセストークン(UUID)       | 01234567-89ab-cdef-0123-456789abcdef |
    | パスワード | アクセストークンシークレット | SAMPLETOKENSAMPLETOKENSAMPLETOKENSAM |
    <div class="warning">
      <b>操作マニュアル</b><br />
      <ul><li><a href="https://manual.sakura.ad.jp/cloud/api/apikey.html">APIキー | さくらのクラウド ドキュメント</a></li></ul>
    </div>

    ## APIエンドポイント
    | ゾーン名      | APIエンドポイントURL                                      |
    |---------------|-----------------------------------------------------------|
    | 東京第1ゾーン | https://secure.sakura.ad.jp/cloud/zone/tk1a/api/cloud/1.1  |
    | 東京第2ゾーン | https://secure.sakura.ad.jp/cloud/zone/tk1b/api/cloud/1.1  |
    | サンドボックスゾーン | https://secure.sakura.ad.jp/cloud/zone/tk1v/api/cloud/1.1  |
    | 石狩第1ゾーン | https://secure.sakura.ad.jp/cloud/zone/is1a/api/cloud/1.1  |
    | 石狩第2ゾーン | https://secure.sakura.ad.jp/cloud/zone/is1b/api/cloud/1.1  |
    | 石狩第3ゾーン | https://secure.sakura.ad.jp/cloud/zone/is1c/api/cloud/1.1  |

    ## 入力パラメータ
    APIの入力には送信先URLに対して、いくつかのヘッダーとAPIキーを送信します。

    - 認証方式はHTTP Basic認証です。APIキーのアクセストークンをユーザーID、アクセストークンシークレットをパスワードとして指定します。

    ```
    # 入力サンプル
    curl \
      -u '01234567-89ab-cdef-0123-456789abcdef:SAMPLETOKENSAMPLETOKENSAMPLETOKENSAM' \
      -X GET \
      'https://secure.sakura.ad.jp/cloud/zone/tk1a/api/cloud/1.1/appliances'
    ```
tags:
  - name: インターフェース管理
    description: サービスエンドポイントゲートウェイのインターフェースに関する操作をまとめたタグです。
  - name: 起動状態管理
    description: サービスエンドポイントゲートウェイの起動状態に関する操作（起動・停止・リセットなど）をまとめたタグです。
  - name: ServiceEndpointGateway
    description: Service Endpoint Gateway に関する操作（一覧・取得など）をまとめたタグです。
paths:
  /appliance:
    get:
      operationId: listServiceEndpointGateways
      summary: サービスエンドポイントゲートウェイ一覧取得API
      description: サービスエンドポイントゲートウェイの一覧を取得します。
      parameters: []
      responses:
        '200':
          description: 成功時のレスポンス
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Appliance.ListServiceEndpointGatewaysResponseBody'
        default:
          description: デフォルトのエラーレスポンス
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Common.DefaultErrorResponseBody'
      tags:
        - ServiceEndpointGateway
    post:
      operationId: createServiceEndpointGateway
      summary: サービスエンドポイントゲートウェイ作成API
      description: 指定したサービスエンドポイントゲートウェイを作成します。
      parameters: []
      responses:
        '202':
          description: 成功時のレスポンス
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Appliance.CreateServiceEndpointGatewayResponseBody'
        default:
          description: デフォルトのエラーレスポンス
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Common.DefaultErrorResponseBody'
      tags:
        - ServiceEndpointGateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Models.Appliance.CreateServiceEndpointGatewayRequest'
  /appliance/{applianceID}:
    get:
      operationId: readServiceEndpointGateway
      summary: サービスエンドポイントゲートウェイ取得API
      description: 指定したサービスエンドポイントゲートウェイの情報を取得します。
      parameters:
        - name: applianceID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功時のレスポンス
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Appliance.ReadServiceEndpointGatewayResponseBody'
        default:
          description: デフォルトのエラーレスポンス
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Common.DefaultErrorResponseBody'
      tags:
        - ServiceEndpointGateway
    put:
      operationId: updateServiceEndpointGateway
      summary: サービスエンドポイントゲートウェイ更新API
      description: |-
        指定したサービスエンドポイントゲートウェイの情報を更新します。

        更新後には、別途「サービスエンドポイントゲートウェイ適用API」を呼び出して設定を反映する必要があります。
      parameters:
        - name: applianceID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功時のレスポンス
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Appliance.ReadServiceEndpointGatewayResponseBody'
        default:
          description: デフォルトのエラーレスポンス
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Common.DefaultErrorResponseBody'
      tags:
        - ServiceEndpointGateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Models.Appliance.UpdateServiceEndpointGatewayRequest'
    delete:
      operationId: deleteServiceEndpointGateway
      summary: サービスエンドポイントゲートウェイ削除API
      description: 指定したサービスエンドポイントゲートウェイを削除します。
      parameters:
        - name: applianceID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功時のレスポンス
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Appliance.ReadServiceEndpointGatewayResponseBody'
        default:
          description: デフォルトのエラーレスポンス
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Common.DefaultErrorResponseBody'
      tags:
        - ServiceEndpointGateway
  /appliance/{applianceID}/config:
    put:
      operationId: applyServiceEndpointGatewayConfig
      summary: サービスエンドポイントゲートウェイ適用API
      description: 指定したサービスエンドポイントゲートウェイの情報を適用します。
      parameters:
        - name: applianceID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功時のレスポンス
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Appliance.ApplianceApplyResponseBody'
        default:
          description: デフォルトのエラーレスポンス
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Common.DefaultErrorResponseBody'
      tags:
        - ServiceEndpointGateway
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Models.Appliance.UpdateServiceEndpointGatewayRequest'
  /appliance/{applianceID}/interface/{interfaceID}:
    get:
      operationId: readServiceEndpointGatewayInterface
      summary: サービスエンドポイントゲートウェイインターフェース情報取得API
      description: 指定したサービスエンドポイントゲートウェイのインターフェース情報を取得します。
      parameters:
        - name: applianceID
          in: path
          required: true
          schema:
            type: string
        - name: interfaceID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功時のレスポンス
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Appliance.ReadServiceEndpointGatewayInterfaceResponseBody'
        default:
          description: デフォルトのエラーレスポンス
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Common.DefaultErrorResponseBody'
      tags:
        - インターフェース管理
  /appliance/{applianceID}/power:
    get:
      operationId: readServiceEndpointGatewayPowerStatus
      summary: サービスエンドポイントゲートウェイ起動状態取得API
      description: 指定したサービスエンドポイントゲートウェイの起動状態を取得します。
      parameters:
        - name: applianceID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功時のレスポンス
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Power.ReadServiceEndpointGatewayPowerStatusResponseBody'
        default:
          description: デフォルトのエラーレスポンス
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Common.DefaultErrorResponseBody'
      tags:
        - 起動状態管理
    put:
      operationId: powerOnServiceEndpointGateway
      summary: サービスエンドポイントゲートウェイ起動API
      description: 指定したサービスエンドポイントゲートウェイを起動します。
      parameters:
        - name: applianceID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功時のレスポンス
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Power.UpdateServiceEndpointGatewayPowerStatusResponseBody'
        default:
          description: デフォルトのエラーレスポンス
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Common.DefaultErrorResponseBody'
      tags:
        - 起動状態管理
    delete:
      operationId: powerOffServiceEndpointGateway
      summary: サービスエンドポイントゲートウェイ停止API
      description: 指定したサービスエンドポイントゲートウェイを停止します。
      parameters:
        - name: applianceID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功時のレスポンス
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Power.UpdateServiceEndpointGatewayPowerStatusResponseBody'
        default:
          description: デフォルトのエラーレスポンス
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Common.DefaultErrorResponseBody'
      tags:
        - 起動状態管理
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Models.Power.ApplianceDeletePowerStatusRequest'
  /appliance/{applianceID}/reset:
    put:
      operationId: resetServiceEndpointGateway
      summary: サービスエンドポイントゲートウェイ起動状態リセットAPI
      description: 指定したサービスエンドポイントゲートウェイの起動状態をリセットします。
      parameters:
        - name: applianceID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功時のレスポンス
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Power.UpdateServiceEndpointGatewayPowerStatusResponseBody'
        default:
          description: デフォルトのエラーレスポンス
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Common.DefaultErrorResponseBody'
      tags:
        - 起動状態管理
components:
  schemas:
    Models.Appliance.Appliance:
      type: object
      required:
        - ID
        - Class
        - Name
        - Description
        - Plan
        - Settings
        - SettingsHash
        - Remark
        - Availability
        - Instance
        - Disk
        - ServiceClass
        - Generation
        - CreatedAt
        - Icon
        - Switch
        - Interfaces
        - Tags
      properties:
        ID:
          type: string
        Class:
          type: string
          enum:
            - serviceendpointgateway
          description: クラス名
        Name:
          type: string
          description: 名前
        Description:
          type: string
          description: 説明
        Plan:
          allOf:
            - $ref: '#/components/schemas/Models.Plan.Plan'
          description: プラン情報
        Settings:
          anyOf:
            - $ref: '#/components/schemas/Models.Settings.ApplianceSettings'
            - type: 'null'
          description: 設定情報
        SettingsHash:
          anyOf:
            - type: string
            - type: 'null'
          description: 設定情報のハッシュ値
        Remark:
          anyOf:
            - $ref: '#/components/schemas/Models.Remark.ApplianceRemark'
            - type: 'null'
          description: 備考情報
        Availability:
          type: string
          enum:
            - available
            - unavailable
            - migrating
          description: 稼働状態
        Instance:
          allOf:
            - $ref: '#/components/schemas/Models.Instance.Instance'
          description: インスタンス情報
        Disk:
          anyOf:
            - $ref: '#/components/schemas/Models.Disk.Disk'
            - type: 'null'
          description: ディスク情報
        ServiceClass:
          type: string
          enum:
            - cloud/appliance/serviceendpointgateway/1
          description: サービスクラス
        Generation:
          type: integer
          format: int32
          description: 世代
        CreatedAt:
          type: string
          description: 作成日時
        Icon:
          type: 'null'
          description: アイコン情報
        Switch:
          allOf:
            - $ref: '#/components/schemas/Models.Network.Switch'
          description: 接続先スイッチ情報
        Interfaces:
          type: array
          items:
            $ref: '#/components/schemas/Models.Network.Interface'
          description: インターフェース情報
        Tags:
          type: array
          prefixItems: []
          description: タグ情報
    Models.Appliance.ApplianceApplyResponseBody:
      type: object
      required:
        - Success
        - ReturnCode
        - ResponseHeaders
        - Out
        - is_ok
      properties:
        Success:
          type: boolean
          description: Apply結果
        ReturnCode:
          type: integer
          format: int32
          description: 実行時のリターンコード
        ResponseHeaders:
          type: object
          properties:
            Status:
              type: string
              description: レスポンスのステータスコード
            Cause:
              anyOf:
                - type: string
                - type: 'null'
              description: レスポンスの原因
          required:
            - Status
            - Cause
          description: レスポンスヘッダー情報
        Out:
          anyOf:
            - type: string
            - type: 'null'
          description: 出力情報
        is_ok:
          type: boolean
          description: 操作結果
      examples:
        - Success: true
          ReturnCode: 0
          ResponseHeaders:
            Status: Ok
            Cause: null
          Out: null
          is_ok: true
    Models.Appliance.ApplianceCreateBody:
      type: object
      required:
        - Class
        - Plan
        - Remark
      properties:
        Class:
          type: string
          enum:
            - serviceendpointgateway
          description: クラス名
        Plan:
          allOf:
            - $ref: '#/components/schemas/Models.Plan.Plan'
          description: プラン情報
        Remark:
          allOf:
            - $ref: '#/components/schemas/Models.Remark.ApplianceCreateRemark'
          description: 備考情報
    Models.Appliance.ApplianceUpdateBody:
      type: object
      required:
        - Settings
      properties:
        Settings:
          allOf:
            - $ref: '#/components/schemas/Models.Settings.ApplianceSettings'
          description: 設定情報
    Models.Appliance.CreateServiceEndpointGatewayRequest:
      type: object
      required:
        - Appliance
      properties:
        Appliance:
          $ref: '#/components/schemas/Models.Appliance.ApplianceCreateBody'
      examples:
        - Appliance:
            Class: serviceendpointgateway
            Plan:
              ID: 1
            Remark:
              Switch:
                ID: '123456789012'
              Network:
                NetworkMaskLen: 24
              Servers:
                - IPAddress: 192.0.2.15
