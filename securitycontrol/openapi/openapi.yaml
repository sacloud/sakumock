openapi: 3.1.0
info:
  title: Security Control API
  version: 1.0.0
  description: |-
    さくらのクラウド セキュリティコントロール機能のAPI。

    クラウド環境におけるセキュリティ上の問題を早期に発見して対応を支援する。
externalDocs:
  url: https://manual.sakura.ad.jp/cloud/controlpanel/eventlog/security-control.html
tags:
  - name: 有効化
  - name: 評価ルール
  - name: 自動アクション
paths:
  /activation:
    post:
      operationId: createActivation
      summary: 現在のプロジェクトの有効化
      description: |-
        現在のプロジェクトでセキュリティコントロールを有効化します。
        成功時は201を返し、リクエストが不正な場合は400を返します。
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationOutput'
        '400':
          description: サーバーがリクエストのパラメータやペイロードを理解できなかった場合のエラー。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequest'
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: |-
            認証が必要なリクエスト。
            ユーザーが認証されていない、または認証トークンが無効な場合に返されるエラー。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: |-
            サーバーがリクエストを理解したが認可を拒否した場合のエラー。
            ユーザーにリソースへのアクセス権限がない場合に返される。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Forbidden'
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '409':
          description: |-
            リクエストが現在のリソースの状態と競合した場合のエラー。

            例えば、既に存在するリソースを再度作成しようとした場合などに返される。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Conflict'
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '429':
          description: |-
            クライアントが一定期間内に過剰なリクエストを送信した場合のエラー。

            レートリミットに達した場合に返される。
          headers:
            Retry-After:
              required: false
              description: クライアントが再試行するまでにどれぐらい待つべきかを示す。
              schema:
                anyOf:
                  - $ref: '#/components/schemas/clientDelaySeconds'
                  - $ref: '#/components/schemas/clientRetryDateTime'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
        default:
          description: An unexpected error response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnexpectedError'
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedError'
      tags:
        - 有効化
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationCreateInput'
    get:
      operationId: readActivation
      summary: 現在のプロジェクトの有効化状態の取得
      description: |-
        現在のプロジェクトの有効化状態を取得します。
        成功時は200で有効化詳細を返し、プロジェクトがまだ一度も有効化されていない場合は404を返します。
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationOutput'
        '401':
          description: |-
            認証が必要なリクエスト。
            ユーザーが認証されていない、または認証トークンが無効な場合に返されるエラー。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: |-
            サーバーがリクエストを理解したが認可を拒否した場合のエラー。
            ユーザーにリソースへのアクセス権限がない場合に返される。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Forbidden'
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: |-
            リクエストされたリソースが見つからない場合のエラー。
            リソースが存在しない、またはアクセスできない場合に返される。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFound'
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '429':
          description: |-
            クライアントが一定期間内に過剰なリクエストを送信した場合のエラー。

            レートリミットに達した場合に返される。
          headers:
            Retry-After:
              required: false
              description: クライアントが再試行するまでにどれぐらい待つべきかを示す。
              schema:
                anyOf:
                  - $ref: '#/components/schemas/clientDelaySeconds'
                  - $ref: '#/components/schemas/clientRetryDateTime'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
        default:
          description: An unexpected error response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnexpectedError'
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedError'
      tags:
        - 有効化
    put:
      operationId: updateActivation
      summary: 現在のプロジェクトの有効化状態の更新
      description: |-
        現在のプロジェクトの有効化状態を更新します。
        成功時は200で更新後の有効化詳細を返し、リクエストが不正な場合は400を返します。
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationOutput'
        '400':
          description: サーバーがリクエストのパラメータやペイロードを理解できなかった場合のエラー。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequest'
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: |-
            認証が必要なリクエスト。
            ユーザーが認証されていない、または認証トークンが無効な場合に返されるエラー。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: |-
            サーバーがリクエストを理解したが認可を拒否した場合のエラー。
            ユーザーにリソースへのアクセス権限がない場合に返される。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Forbidden'
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: |-
            リクエストされたリソースが見つからない場合のエラー。
            リソースが存在しない、またはアクセスできない場合に返される。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFound'
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '429':
          description: |-
            クライアントが一定期間内に過剰なリクエストを送信した場合のエラー。

            レートリミットに達した場合に返される。
          headers:
            Retry-After:
              required: false
              description: クライアントが再試行するまでにどれぐらい待つべきかを示す。
              schema:
                anyOf:
                  - $ref: '#/components/schemas/clientDelaySeconds'
                  - $ref: '#/components/schemas/clientRetryDateTime'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
        default:
          description: An unexpected error response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnexpectedError'
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedError'
      tags:
        - 有効化
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationUpdateInput'
  /automated_actions:
    post:
      operationId: createAutomatedAction
      summary: 自動アクションの作成
      description: 新しい自動アクションを作成します。
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomatedActionOutput'
        '400':
          description: サーバーがリクエストのパラメータやペイロードを理解できなかった場合のエラー。
          content:
            application/problem+json:
