name: release

# Releases the unified `sakumock` binary. tagpr maintains a release PR for the
# repository (bare vX.Y.Z tags); when that PR is merged, tagpr creates the tag
# and GoReleaser builds the binaries and creates the GitHub Release in the same
# job. Running GoReleaser in the same run avoids the GITHUB_TOKEN limitation
# where a tag pushed by the token does not trigger a new workflow.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: read
  packages: write # push the container image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: tagpr
        uses: Songmu/tagpr@e1250d6c84e4425db82b5e90549d62dfe23e9ebe # v1.21.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: .tagpr
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.tagpr.outputs.tag != ''
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      # Buildx is required by GoReleaser's `use: buildx` docker builds; QEMU lets
      # the amd64 runner produce the arm64 image variant.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.tagpr.outputs.tag != ''
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.tagpr.outputs.tag != ''
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.tagpr.outputs.tag != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The repository is a single Go module, so the released binary reflects
      # the source of every service at the tagged commit. GoReleaser builds the
      # binaries, then builds and pushes the multi-arch container image to ghcr.io.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        if: steps.tagpr.outputs.tag != ''
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
