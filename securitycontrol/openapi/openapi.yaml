        - action
        - executionCondition
        - isEnabled
      properties:
        name:
          type: string
          description: 自動アクションの名称。
        description:
          type: string
          description: 自動アクションの説明。
        action:
          allOf:
            - $ref: '#/components/schemas/ActionDefinition'
