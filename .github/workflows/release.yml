name: release

# Releases the unified `sakumock` binary. tagpr maintains a release PR for the
# repository (bare vX.Y.Z tags); when that PR is merged, tagpr creates the tag
# and GoReleaser builds the binaries and creates the GitHub Release in the same
# job. Running GoReleaser in the same run avoids the GITHUB_TOKEN limitation
# where a tag pushed by the token does not trigger a new workflow.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: read
  packages: write # push the container image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: tagpr
        uses: Songmu/tagpr@2afc990a4a5a9a340665cc1a484c2102f7de332f # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: .tagpr
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        if: steps.tagpr.outputs.tag != ''
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      # Buildx is required by GoReleaser's `use: buildx` docker builds; QEMU lets
      # the amd64 runner produce the arm64 image variant.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.tagpr.outputs.tag != ''
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.tagpr.outputs.tag != ''
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.tagpr.outputs.tag != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The repository is a single Go module, so the released binary reflects
      # the source of every service at the tagged commit. GoReleaser builds the
      # binaries, then builds and pushes the multi-arch container image to ghcr.io.
      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        if: steps.tagpr.outputs.tag != ''
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
