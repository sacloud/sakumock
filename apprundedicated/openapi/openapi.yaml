security:
  - BasicAuth: []
components:
  schemas:
    ApplicationCurrentContainer:
      type: object
      required:
        - id
        - image
        - state
        - status
        - cpuUsagePercent
        - applicationID
        - applicationVersion
      properties:
        id:
          type: string
          description: コンテナID
        image:
          type: string
          description: イメージ名
        state:
          type: string
          description: コンテナのステート（created、running、restarting、removing、paused、exited、dead のうちいずれか）
        status:
          type: string
          description: コンテナのステータス
        cpuUsagePercent:
          type: number
          format: float
          description: コンテナのCPU使用率（単位：%）
        applicationID:
          allOf:
            - $ref: '#/components/schemas/ApplicationID'
          description: アプリケーションID
        applicationVersion:
          allOf:
            - $ref: '#/components/schemas/ApplicationVersionNumber'
          description: アプリケーションのバージョン
    ApplicationCurrentContainers:
      type: object
      required:
        - collectedAtSec
        - containers
      properties:
        collectedAtSec:
          type: integer
          format: unixtime
          description: 状態回収日時：UNIX時間（秒）
        containers:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationCurrentContainer'
    ApplicationDesiredContainer:
      type: object
      required:
        - applicationID
        - applicationVersion
        - cpuMillis
        - memoryMB
        - image
      properties:
        applicationID:
          allOf:
            - $ref: '#/components/schemas/ApplicationID'
          description: デプロイするアプリケーションID
        applicationVersion:
          allOf:
            - $ref: '#/components/schemas/ApplicationVersionNumber'
          description: デプロイするアプリケーションのバージョン
        cpuMillis:
          type: integer
          format: int64
          description: 割り当てるCPU（単位：mCPU）
        memoryMB:
          type: integer
          format: int64
          description: 割り当てるメモリ（単位：MB）
        image:
          type: string
          description: デプロイするコンテナのイメージ名
    ApplicationDesiredContainers:
      type: object
      required:
        - containers
      properties:
        containers:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationDesiredContainer'
    ApplicationID:
      type: string
      format: uuid
    ApplicationIdentifier:
      type: object
      required:
        - applicationID
      properties:
        applicationID:
          allOf:
            - $ref: '#/components/schemas/ApplicationID'
          description: ID
          readOnly: true
    ApplicationVersionIdentifier:
      type: object
      required:
        - version
      properties:
        version:
          allOf:
            - $ref: '#/components/schemas/ApplicationVersionNumber'
          readOnly: true
    ApplicationVersionNumber:
      type: integer
      format: int32
      minimum: 1
      example: 3
    ApplicationVersionSummary:
      type: object
      required:
        - version
        - image
        - activeNodeCount
        - created
      properties:
        version:
          allOf:
            - $ref: '#/components/schemas/ApplicationVersionNumber'
          readOnly: true
        image:
          type: string
          maxLength: 512
          example: nginx:latest
        activeNodeCount:
          type: integer
          format: int64
          description: 現在動いているノードの数
          readOnly: true
        created:
          type: integer
          format: unixtime
          description: アプリケーションバージョン作成日時：UNIX時間（秒）
          readOnly: true
    AutoScalingGroupID:
      type: string
      format: uuid
    AutoScalingGroupIdentifier:
      type: object
      required:
        - autoScalingGroupID
      properties:
        autoScalingGroupID:
          allOf:
            - $ref: '#/components/schemas/AutoScalingGroupID'
          readOnly: true
    AutoScalingGroupNodeInterface:
      type: object
      required:
        - interfaceIndex
        - upstream
        - connectsToLB
      properties:
        interfaceIndex:
          type: integer
          format: int16
          description: インターフェース番号。例：eth0→0、eth1→1、eth2→2。0は必須。重複不可。
        upstream:
          type: string
          description: "'shared' にすると共有セグメントに繋がります。ルータ+スイッチ、および共有セグメントにつなげられるのは eth0 のみです。"
          title: 接続先スイッチ
        ipPool:
          type: array
          items:
            $ref: '#/components/schemas/IpRange'
          maxItems: 20
          description: IPプールは最大20個まで指定可能。アップストリームが 'shared' の場合は指定できません。それ以外の場合は指定必須です。
          title: IPアドレスの割り当て範囲
        netmaskLen:
          type: integer
          format: int16
          minimum: 8
          maximum: 29
          description: アップストリームが 'shared' の場合、指定できません。それ以外の場合は指定必須です。
          title: ネットマスク長
        defaultGateway:
          type: string
          description: アップストリームが 'shared' の場合、指定できません。
          title: デフォルトゲートウェイ
        packetFilterID:
          type: string
          description: パケットフィルターID
        connectsToLB:
          type: boolean
          description: 一つのオートスケーリンググループにつき、一つのインターフェースのみがロードバランサ接続対象となる。接続対象になった場合、そのインターフェースに割り当てられた IP アドレスがロードバランサのバックエンドとして登録される。クラスタにロードバランサポートが設定されている場合、一つのインターフェースが true である必要がある。
          title: ロードバランサ接続対象インターフェースかどうか
    CertificateID:
      type: string
      format: uuid
      example: 13B9EA83-DDB0-4385-9533-3D693A6A310F
    CertificateIdentifier:
      type: object
      required:
        - certificateID
      properties:
        certificateID:
          allOf:
            - $ref: '#/components/schemas/CertificateID'
          description: 証明書ID
          readOnly: true
    ClusterID:
      type: string
      format: uuid
      description: クラスタID
      example: 13B9EA83-DDB0-4385-9533-3D693A6A310F
    ClusterIdentifier:
      type: object
      required:
        - clusterID
      properties:
        clusterID:
          allOf:
            - $ref: '#/components/schemas/ClusterID'
          readOnly: true
    ClusterLoadBalancerPort:
      type: object
      required:
        - port
        - protocol
      properties:
        port:
          type: integer
          format: uint16
          minimum: 1
          maximum: 65535
          description: 外部公開するポート番号。5950-5959は予約されているため指定不可
          example: 8080
        protocol:
          type: string
          enum:
            - http
            - https
            - tcp
          description: ポートで扱うプロトコル
    ClusterLoadBalancerPortMergePatchCreateOrUpdateReplaceOnly:
      type: object
      required:
        - port
        - protocol
      properties:
        port:
          type: integer
          format: uint16
          minimum: 1
          maximum: 65535
          description: 外部公開するポート番号。5950-5959は予約されているため指定不可
          example: 8080
        protocol:
          type: string
          enum:
            - http
            - https
            - tcp
          description: ポートで扱うプロトコル
    CreateApplicationRequest:
      type: object
      required:
        - name
        - clusterID
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 20
          pattern: ^[a-zA-Z0-9_-]+$
          description: アプリケーションの名前。クラスタの中ではユニーク。英数字とハイフン、アンダースコアのみ使用可能
          example: bbs
        clusterID:
          allOf:
            - $ref: '#/components/schemas/ClusterID'
          description: デプロイ先クラスタ
    CreateApplicationResponse:
      type: object
      required:
        - application
      properties:
        application:
          allOf:
            - $ref: '#/components/schemas/ApplicationIdentifier'
          description: 作成されたアプリケーションの情報
    CreateApplicationVersionRequest:
      type: object
      required:
        - image
        - cpu
        - memory
        - scalingMode
        - registryUsername
        - registryPassword
        - registryPasswordAction
        - exposedPorts
        - env
      properties:
        image:
          type: string
          maxLength: 512
          example: nginx:latest
        cpu:
          type: integer
          format: int64
          minimum: 100
          maximum: 64000
          example: 500
        memory:
          type: integer
          format: int64
          minimum: 128
          maximum: 131072
          example: 1000
        scalingMode:
          $ref: '#/components/schemas/ScalingMode'
        fixedScale:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
        minScale:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
          example: 1
        maxScale:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
          example: 3
        scaleInThreshold:
          type: integer
          format: int32
          minimum: 30
          maximum: 70
          example: 30
        scaleOutThreshold:
          type: integer
          format: int32
          minimum: 50
          maximum: 99
          example: 95
        cmd:
          type: array
          items:
            type: string
          maxItems: 20
          description: コンテナ起動時に実行するコマンドと引数
        registryUsername:
          type: string
          nullable: true
          maxLength: 255
          description: レジストリのユーザ名。未設定の場合はnull。
        registryPassword:
          type: string
          nullable: true
          maxLength: 255
          description: レジストリのパスワード。レスポンスではマスクされる。未設定の場合はnull。
        registryPasswordAction:
          allOf:
            - $ref: '#/components/schemas/RegistryPasswordAction'
          description: レジストリパスワードの設定方法
        exposedPorts:
          type: array
          items:
            $ref: '#/components/schemas/ExposedPort'
          maxItems: 5
          description: アプリケーションが公開するポート番号。同一クラスタ内で、ポートの重複不可。
        env:
          type: array
          items:
            $ref: '#/components/schemas/CreateEnvironmentVariable'
          maxItems: 50
          description: 環境変数
    CreateApplicationVersionResponse:
      type: object
      required:
        - applicationVersion
      properties:
        applicationVersion:
          allOf:
            - $ref: '#/components/schemas/ApplicationVersionIdentifier'
          description: 作成されたアプリケーションバージョンの情報
    CreateAutoScalingGroupRequest:
      type: object
      required:
        - name
        - zone
        - workerServiceClassPath
        - minNodes
        - maxNodes
        - interfaces
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 20
          pattern: ^[a-zA-Z0-9_-]+$
          description: オートスケーリンググループの名前。クラスタ内でユニーク。英数字、アンダースコア、ハイフンのみ使用可能
        zone:
          type: string
          description: オートスケーリンググループのゾーン
        nameServers:
          type: array
          items:
            $ref: '#/components/schemas/Ipv4'
          minItems: 1
          maxItems: 3
          description: ネームサーバ設定
        workerServiceClassPath:
          type: string
          minLength: 1
          maxLength: 255
          description: ワーカノードのサービスクラスパス
        minNodes:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
          description: オートスケーリンググループの最小ノード数
        maxNodes:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
          description: オートスケーリンググループの最大ノード数
        interfaces:
          type: array
          items:
            $ref: '#/components/schemas/AutoScalingGroupNodeInterface'
          minItems: 1
          maxItems: 5
          title: ネットワークインターフェース定義
    CreateAutoScalingGroupResponse:
      type: object
      required:
        - autoScalingGroup
      properties:
        autoScalingGroup:
          allOf:
            - $ref: '#/components/schemas/AutoScalingGroupIdentifier'
          description: 作成されたオートスケーリンググループの情報
    CreateCertificateRequest:
      type: object
      required:
