paths:
  /clusters:
    get:
      operationId: listClusters
      tags:
        - サイト
      servers:
        - url: https://secure.sakura.ad.jp/cloud/zone/is1a/api/objectstorage/1.0/fed/v1
      summary: サイト一覧の取得
      description: |-
        アクセス先ベースURL: `https://secure.sakura.ad.jp/cloud/zone/is1a/api/objectstorage/1.0/fed/v1`

        上記アクセス先ベースURLと右ペインのパスを組み合わせたものがアクセス先URLになります。
        例えば、右ペインのパスが `/clusters` の場合、アクセス先URLは、
        `https://secure.sakura.ad.jp/cloud/zone/is1a/api/objectstorage/1.0/fed/v1/clusters`
        となります。
      responses:
        '200':
          description: サイト一覧の取得に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ListClustersResponse'
        '401':
          description: 認証に失敗しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
  '/clusters/{id}':
    get:
      operationId: readCluster
      tags:
        - サイト
      servers:
        - url: https://secure.sakura.ad.jp/cloud/zone/is1a/api/objectstorage/1.0/fed/v1
      summary: サイトの取得
      description: |-
        アクセス先ベースURL: `https://secure.sakura.ad.jp/cloud/zone/is1a/api/objectstorage/1.0/fed/v1`

        上記アクセス先ベースURLと右ペインのパスを組み合わせたものがアクセス先URLになります。
        例えば、右ペインのパスが `/clusters` の場合、アクセス先URLは、
        `https://secure.sakura.ad.jp/cloud/zone/is1a/api/objectstorage/1.0/fed/v1/clusters`
        となります。
      parameters:
        - description: サイトID
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: サイトの取得に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ReadClusterResponse'
        '401':
          description: 認証に失敗しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: サイトが見つかりませんでした
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
  '/buckets':
    get:
      operationId: listBuckets
      tags:
        - バケット
      summary: バケット一覧の取得
      description: |-
        アクセス先ベースURL: `https://secure.sakura.ad.jp/cloud/zone/is1a/api/objectstorage/1.0/（サイト名）/v2/`

        上記アクセス先ベースURLと右ペインのパスを組み合わせたものがアクセス先URLになります。
        例えば、右ペインのパスが `/account` の場合、アクセス先URLは、
        `https://secure.sakura.ad.jp/cloud/zone/is1a/api/objectstorage/1.0/（サイト名）/v2/account`
        となります。

        なお、サイト名の取得方法は「利用例＞接続先サイト一覧の取得」をご参考下さい。
      responses:
        '200':
          description: バケット一覧の取得に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ListBucketsResponse'
        '401':
          description: 認証に失敗しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
  '/buckets/{name}':
    put:
      operationId: createBucket
      tags:
        - バケット
      servers:
        - url: https://secure.sakura.ad.jp/cloud/zone/is1a/api/objectstorage/1.0/fed/v1
      summary: バケットの作成
      description: |-
        アクセス先ベースURL: `https://secure.sakura.ad.jp/cloud/zone/is1a/api/objectstorage/1.0/fed/v1`

        上記アクセス先ベースURLと右ペインのパスを組み合わせたものがアクセス先URLになります。
        例えば、右ペインのパスが `/clusters` の場合、アクセス先URLは、
        `https://secure.sakura.ad.jp/cloud/zone/is1a/api/objectstorage/1.0/fed/v1/clusters`
        となります。
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: バケット名
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/handler.CreateBucketRequestBody'
        description: 作成したいバケット情報
        required: true
      responses:
        '201':
          description: バケット作成に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.CreateBucketResponse'
        '400':
          description: バケット名が不正です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '404':
          description: サイトアカウントが見つかりませんでした
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: 同名バケットがすでに存在する、または制限値の上限に達したためバケット作成ができません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
    delete:
      operationId: deleteBucket
      tags:
        - バケット
      servers:
        - url: https://secure.sakura.ad.jp/cloud/zone/is1a/api/objectstorage/1.0/fed/v1
      summary: バケットの削除
      description: |-
        アクセス先ベースURL: `https://secure.sakura.ad.jp/cloud/zone/is1a/api/objectstorage/1.0/fed/v1`

        上記アクセス先ベースURLと右ペインのパスを組み合わせたものがアクセス先URLになります。
        例えば、右ペインのパスが `/clusters` の場合、アクセス先URLは、
        `https://secure.sakura.ad.jp/cloud/zone/is1a/api/objectstorage/1.0/fed/v1/clusters`
        となります。
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: バケット名
      responses:
        '204':
          description: バケット削除に成功しました
        '400':
          description: バケット名が不正です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '409':
          description: バケットに関係するリソースが残っています、先にそれらのリソースを削除する必要があります
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
  /buckets/{name}/replication:
    get:
      operationId: readBucketReplication
      tags:
        - バケット
      summary: バケットのレプリケーション設定の取得
      description: |-
        アクセス先ベースURL: `https://secure.sakura.ad.jp/cloud/zone/is1a/api/objectstorage/1.0/fed/v1`

        上記アクセス先ベースURLと右ペインのパスを組み合わせたものがアクセス先URLになります。
        例えば、右ペインのパスが `/clusters` の場合、アクセス先URLは、
        `https://secure.sakura.ad.jp/cloud/zone/is1a/api/objectstorage/1.0/fed/v1/clusters`
        となります。
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: バケット名
      responses:
        '200':
          description: レプリケーション設定の取得に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ReadBucketReplicationResponse'
        '401':
          description: 認証に失敗しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: 指定したバケットが見つかりませんでした
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
    post:
      operationId: createBucketReplication
      tags:
        - バケット
      servers:
        - url: https://secure.sakura.ad.jp/cloud/zone/is1a/api/objectstorage/1.0/fed/v1
      summary: バケットのレプリケーション設定の作成
      description: |-
        アクセス先ベースURL: `https://secure.sakura.ad.jp/cloud/zone/is1a/api/objectstorage/1.0/fed/v1`

        上記アクセス先ベースURLと右ペインのパスを組み合わせたものがアクセス先URLになります。
        例えば、右ペインのパスが `/clusters` の場合、アクセス先URLは、
        `https://secure.sakura.ad.jp/cloud/zone/is1a/api/objectstorage/1.0/fed/v1/clusters`
        となります。
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: バケット名
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dest_bucket
              properties:
                dest_bucket:
                  type: string
      responses:
        '201':
          description: レプリケーション設定の作成に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.CreateBucketReplicationResponse'
        '400':
          description: 不正なリクエストです
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: 認証に失敗しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: 指定したバケットが見つかりませんでした
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
    delete:
      operationId: deleteBucketReplication
      tags:
        - バケット
