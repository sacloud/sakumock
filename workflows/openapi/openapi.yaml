    post:
      operationId: createWorkflow
      description: ワークフローを作成する
      summary: ワークフローを作成する
      tags:
        - ワークフローの管理
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Name:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: ^[a-zA-Z0-9_\-ーぁ-んァ-ヶ一-龠]+$
                Description:
                  type: string
                  minLength: 0
                  maxLength: 1024
                Runbook:
                  type: string
                Publish:
                  type: boolean
                Logging:
                  type: boolean
                Tags:
                  type: array
                  items:
                    type: object
                    properties:
                      Name:
                        type: string
                        minLength: 1
                        maxLength: 64
                    required:
                      - Name
