openapi: 3.1.0
info:
  title: fixture 3.1
  version: 1.0.0
paths:
  /queues:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQueueRequest'
      responses:
        '201':
          description: created
  /events:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
      responses:
        '201':
          description: created
components:
  schemas:
    CreateQueueRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          pattern: '^[a-zA-Z0-9_-]+$'
        timeout:
          type:
            - integer
            - 'null'
          minimum: 5
          exclusiveMaximum: 900
        priority:
          type:
            - string
            - integer
          minLength: 1
          minimum: 0
        label:
          anyOf:
            - type: string
              maxLength: 8
            - type: 'null'
        owner:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Owner'
        icon:
          type: 'null'
    EventRequest:
      type: object
      required:
        - payload
      properties:
        payload:
          oneOf:
            - $ref: '#/components/schemas/MessageEvent'
            - $ref: '#/components/schemas/TimerEvent'
          discriminator:
            propertyName: kind
        trigger:
          type: object
          oneOf:
            - $ref: '#/components/schemas/MessageEvent'
            - $ref: '#/components/schemas/TimerEvent'
          discriminator:
            propertyName: kind
            mapping:
              msg: '#/components/schemas/MessageEvent'
              timer: TimerEvent
        inline:
          oneOf:
            - type: object
          discriminator:
            propertyName: kind
        matcher:
          $ref: '#/components/schemas/Matcher'
        source:
          type: string
          minLength: 1
    Owner:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
    MessageEvent:
      type: object
      properties:
        kind:
          type: string
    TimerEvent:
      type: object
      properties:
        kind:
          type: string
    Matcher:
      oneOf:
        - $ref: '#/components/schemas/AndMatcher'
        - $ref: '#/components/schemas/LeafMatcher'
      discriminator:
        propertyName: type
        mapping:
          and: '#/components/schemas/AndMatcher'
          leaf: '#/components/schemas/LeafMatcher'
    AndMatcher:
      type: object
      required:
        - type
        - matchers
      properties:
        type:
          type: string
        matchers:
          type: array
          items:
            $ref: '#/components/schemas/Matcher'
    LeafMatcher:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
        value:
          type: string
