    Models.Settings.ServiceConfig:
      type: object
      properties:
        Endpoints:
          type: array
          items:
            type: string
          description: |-
            ### ObjectStorage Type
            エンドポイントは以下に限定されます。

            | 名前 | エンドポイント |
            |---|---|
            | 石狩第1サイト | `s3.isk01.sakurastorage.jp` |
            | 東京第1サイト | `s3.tky01.sakurastorage.jp` |
            | 東京第1サイト（アーカイブプラン） | `s3.arc02.sakurastorage.jp` |

            ### ContainerRegistry Type
            sakuracr.jp のサブドメインを指定してください。

            ### MonitoringSuite Type
            モニタリングスイートのログストレージ・メトリクスストレージのエンドポイントを指定してください。

            | ストレージ | エンドポイントの形式 |
            |---|---|
            | ログストレージ | `[0-9]{12}.logs.monitoring.global.api.sacloud.jp` |
            | メトリクスストレージ | `[0-9]{12}.metrics.monitoring.global.api.sacloud.jp` |

            ### AIEngine Type
            エンドポイントは以下に限定されます。

            - api.ai.sakura.ad.jp

            ### SimpleAI Type
            エンドポイントは以下に限定されます。

            - simpleai.is1.api.sacloud.jp

            ### AppRunDedicatedControlPlane Type
            エンドポイントは指定できません。
        Mode:
          type: string
          enum:
            - Managed
            - ''
          description: |-
            接続先マネージドサービスのエンドポイントの自動設定モード。

            AppRunDedicatedControlPlaneのみ利用できます。
