        上記アクセス先ベースURLと右ペインのパスを組み合わせたものがアクセス先URLになります。
        例えば、右ペインのパスが `/account` の場合、アクセス先URLは、
        `https://secure.sakura.ad.jp/cloud/zone/is1a/api/objectstorage/1.0/（サイト名）/v2/account`
        となります。

        なお、サイト名の取得方法は「利用例＞接続先サイト一覧の取得」をご参考下さい。
      responses:
        '200':
          description: プランの一覧の取得に成功しました
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlanItem'
        '401':
          description: 認証に失敗しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        default:
          description: 不明なエラーです
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDefault'

  /quota:
    get:
      operationId: readQuota
      tags:
        - 全体制限値
      summary: 全体制限値の取得
      description: |-
        アクセス先ベースURL: `https://secure.sakura.ad.jp/cloud/zone/is1a/api/objectstorage/1.0/（サイト名）/v2/`

        上記アクセス先ベースURLと右ペインのパスを組み合わせたものがアクセス先URLになります。
        例えば、右ペインのパスが `/account` の場合、アクセス先URLは、
        `https://secure.sakura.ad.jp/cloud/zone/is1a/api/objectstorage/1.0/（サイト名）/v2/account`
        となります。

        なお、サイト名の取得方法は「利用例＞接続先サイト一覧の取得」をご参考下さい。
      responses:
        '200':
          description: 全体制限値の取得に成功しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quota'
        '401':
          description: 認証に失敗しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        default:
          description: 不明なエラーです
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDefault'
  /metering/buckets/{name}:
    get:
      operationId: listBucketMetering
      tags:
        - メータリング履歴
      summary: バケット使用量の取得
      description: |-
        アクセス先ベースURL: `https://secure.sakura.ad.jp/cloud/zone/is1a/api/objectstorage/1.0/（サイト名）/v2/`

        上記アクセス先ベースURLと右ペインのパスを組み合わせたものがアクセス先URLになります。
        例えば、右ペインのパスが `/account` の場合、アクセス先URLは、
        `https://secure.sakura.ad.jp/cloud/zone/is1a/api/objectstorage/1.0/（サイト名）/v2/account`
        となります。

        なお、サイト名の取得方法は「利用例＞接続先サイト一覧の取得」をご参考下さい。

        指定したバケットの使用量を、指定した月範囲で取得します。
        取得できるデータは月次集計データとなり、日次や時間毎の詳細なデータは取得できません。
        また、指定した月においてバケットの使用が無かった場合でも、ゼロ埋めされたデータが返却されます。
      parameters:
        - in: path
          name: name
          required: true
          description: バケット名
          schema:
            $ref: '#/components/schemas/BucketName'
        - in: query
          name: from
          schema:
            type: string
            format: date
            example: '2022-03'
          description: 範囲の開始月
          required: true
        - in: query
          name: to
          schema:
            type: string
            format: date
            example: '2022-08'
          description: 範囲の終了月
          required: true
      responses:
        '200':
          description: 成功（ゼロ埋めされたレコードを含む場合があります）
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BucketBillingItem'
        '400':
          description: 無効な範囲または範囲が広すぎます
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: 認証に失敗しました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        default:
          description: 不明なエラーです
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDefault'

servers:
  - url: https://secure.sakura.ad.jp/cloud/zone/is1a/api/objectstorage/1.0/isk01/v2
  - url: https://secure.sakura.ad.jp/cloud/zone/is1a/api/objectstorage/1.0/tky01/v2
  - url: https://secure.sakura.ad.jp/cloud/zone/is1a/api/objectstorage/1.0/arc02/v2

security:
  - BasicAuth: []
components:

  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: |-
       [クラウドコントロールパネル](https://secure.sakura.ad.jp/cloud/)で発行したAPIキーを利用します。

        `アクセストークン(UUID)` を「ユーザーID」、`アクセストークンシークレット` を「パスワード」として指定します。
  schemas:
    handler.CreateBucketRequestBody:
      type: object
      required:
        - cluster_id
      properties:
        cluster_id:
          type: string
        plan:
          type: object
          nullable: true
          description: If not specified, the bucket will be created as "standard".
          properties:
            type: { $ref: '#/components/schemas/model.PlanType' }
            service_class_path:
              $ref: '#/components/schemas/ServiceClassPath'
    handler.UpdateBucketEncryptionRequestBody:
      type: object
      required:
        - kms_key_id
      properties:
        kms_key_id:
          allOf:
            - $ref: '#/components/schemas/ResourceID'
    handler.ReadBucketEncryptionResponse:
      type: object
      required:
        - kms_key_id
        - configured_at
      properties:
        kms_key_id:
          allOf:
            - $ref: '#/components/schemas/ResourceID'
        configured_at:
          allOf:
            - $ref: '#/components/schemas/CreatedAt'
    handler.UpdateBucketEncryptionResponse:
      type: object
      required:
        - kms_key_id
        - configured_at
      properties:
        kms_key_id:
          allOf:
            - $ref: '#/components/schemas/ResourceID'
        configured_at:
          allOf:
            - $ref: '#/components/schemas/CreatedAt'
    handler.ReadClusterResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/ClusterResponseBody'
    handler.ListClustersResponse:
      type: object
      required:
      - data
      properties:
        data:
          description: 'If use a pointer type, break output'
          type: array
          items:
            $ref: '#/components/schemas/ClusterResponseBody'
    handler.ListBucketsResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BucketListResponseBody'
    handler.CreateBucketResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/BucketResponseBody'
    handler.ReadBucketReplicationResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/model.Replication'
      # Specifying examples for individual models results in incorrect responses;
      # therefore, the example is defined here.
      example:
        data:
          source_bucket:
            name: my-bucket
            cluster_id: isk01
            plan:
              type: ""
              service_class_path: ""
          dest_bucket:
            name: my-bucket-replica
            cluster_id: tky01
            plan:
              type: ""
              service_class_path: ""
          config_status: created
          created_at: '2024-01-01T12:00:00+09:00'
    handler.CreateBucketReplicationResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/model.Replication'
      # Specifying examples for individual models results in incorrect responses;
      # therefore, the example is defined here.
      example:
        data:
          source_bucket:
            name: my-bucket
            cluster_id: isk01
            plan:
              type: ""
              service_class_path: ""
          dest_bucket:
            name: my-bucket-replica
            cluster_id: tky01
            plan:
              type: ""
              service_class_path: ""
          config_status: created
          created_at: '2024-01-01T12:00:00+09:00'
    handler.ListBucketReplicableTargetsResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BucketListResponseBody'
    handler.CreatePermissionKeyResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/PermissionKeyCreateResponseBody'
    handler.ListPermissionKeysResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PermissionKeyReadResponseBody'
    handler.ReadPermissionKeyResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/PermissionKeyReadResponseBody'
    model.Bucket:
      type: object
      properties:
        cluster_id:
          type: string
        name:
          type: string
        plan:
          type: object
          properties:
            type:
              $ref: '#/components/schemas/model.PlanType'
            service_class_path:
              $ref: '#/components/schemas/ServiceClassPath'
      example:
        cluster_id: isk01
        name: my-bucket
        plan:
          type: standard
          service_class_path: objectstorage/isk01/bucket
    model.Cluster:
      type: object
      properties:
        api_zone:
          description: API Servers Zones
          type: array
          items:
            type: string
          example:
            - is1b
        control_panel_url:
          description: URL of Control Panel
          type: string
          example: secure.sakura.ad.jp/objectstorage/isk01
        display_name_en_us:
          description: Display Name (en-us)
          type: string
          example: 'Ishikari Cluster #1'
        display_name_ja:
          description: Display Name (ja)
          type: string
          example: 石狩第1サイト
        display_name:
          description: Display Name (Depending on Accept-Language)
          type: string
          example: 石狩第1サイト
        display_order:
          description: Display Order (Can be ignored)
          type: integer
          example: 1
        endpoint_base:
          description: Endpoint Base of Cluster
          type: string
          example: isk01.objectstorage.sakurastorage.jp
        id:
          type: string
          example: isk01
        region:
          type: string
          example: jp-north-1
        s3_endpoint:
          description: URL of S3-compat API
          type: string
          example: s3.isk01.objectstorage.sakurastorage.jp
        s3_endpoint_for_control_panel:
          description: URL of S3-compat API (w/ resigning)
          type: string
          example: s3.cp.isk01.objectstorage.sakurastorage.jp
        storage_zone:
          description: Storage Servers Zones
          type: array
          items:
            type: string
          example:
            - is1a
            - is1b
        plan_family:
          type: string
          description: Pricing/behavior family of the cluster.
          enum:
            - standard
            - archive
          example: standard
    model.PlanType:
      type: string
      description: Plan type enum
      enum:
        - standard
        - archive
      example: archive
    model.Replication:
      type: object
      required:
        - source_bucket
        - dest_bucket
        - config_status
        - created_at
      properties:
        source_bucket:
          type: object
          required:
            - name
            - cluster_id
            - plan
          description: Source bucket info
          properties:
            name:
              type: string
            cluster_id:
              type: string
            plan:
              type: object
              required:
                - type
                - service_class_path
              properties:
                type:
                  $ref: '#/components/schemas/model.PlanType'
                service_class_path:
                  $ref: '#/components/schemas/ServiceClassPath'
          example:
            name: my-bucket
            cluster_id: isk01
            plan:
              type: standard
              service_class_path: "objectstorage/isk01/bucket"
        dest_bucket:
          type: object
          required:
            - name
            - cluster_id
            - plan
          description: Destination bucket info
          properties:
            name:
              type: string
            cluster_id:
              type: string
            plan:
              type: object
              required:
                - type
                - service_class_path
              properties:
                type:
                  $ref: '#/components/schemas/model.PlanType'
                service_class_path:
                  $ref: '#/components/schemas/ServiceClassPath'
          example:
            name: my-bucket-replica
            cluster_id: tky01
            plan:
              type: standard
              service_class_path: "objectstorage/isk01/bucket"
        config_status:
          type: string
          enum:
            - creating
            - created
          description: 'creating=federation→cluster applying / created=cluster applied'
        created_at:
          type: string
          format: date-time
    ClusterResponseBody:
      allOf:
      - $ref: '#/components/schemas/model.Cluster'
      - type: object
        required:
        - api_zone
        - control_panel_url
        - display_name_en_us
        - display_name_ja
        - display_name
        - display_order
        - endpoint_base
        - id
        - region
        - s3_endpoint
        - s3_endpoint_for_control_panel
        - storage_zone
        - plan_family
    PlanChangeReqBody:
      type: object
      required:
        - previous_contract
        - new_plan
      properties:
        previous_contract:
          type: object
          required:
          - resource_id
          properties:
            resource_id:
              description: >
                Current contract resource ID.
                This is for validation to avoid recontracting from an unexpected state.
              $ref: '#/components/schemas/ResourceID'
        new_plan:
          type: object
          required:
            - type
            - service_class_path
          description: New plan to recontract to.
          properties:
            type:
              $ref: '#/components/schemas/model.PlanType'
            service_class_path:
              $ref: '#/components/schemas/ServiceClassPath'
    PlanChangeResBody:
      type: object
      properties:
        previous_contract:
          $ref: '#/components/schemas/ContractSummary'
        new_contract:
          $ref: '#/components/schemas/ContractSummary'
        plan:
          $ref: '#/components/schemas/PlanSummary'
    ContractSummary:
      type: object
      required:
      - resource_id
      - status
      - created_at
      - deleted_at
      properties:
        resource_id:
          type: string
          example: "113200009999"
        status:
          type: string
          enum: [active, terminated]
        created_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
    PlanSummary:
      type: object
      required:
      - type
      - service_class_path
      - cluster_id
      - capacity_gib
      properties:
        type:
          $ref: '#/components/schemas/model.PlanType'
        service_class_path:
          $ref: '#/components/schemas/ServiceClassPath'
        cluster_id:
          type: string
          example: isk01
          description: >
            Cluster ID to which this plan applies.
            In the response of /buckets/{name}/plan, this always matches bucket.cluster_id (redundant, read-only).
        capacity_gib:
          type: integer
          nullable: true
          description: Only archive is enabled (capacity resolved from the service class path)
          example: 2000
    PlanWithContract:
      type: object
      required:
      - plan
      - contract
      properties:
        plan:
          $ref: '#/components/schemas/PlanSummary'
        contract:
          $ref: '#/components/schemas/ContractSummary'
    PlanItem:
      type: object
      required:
      - service_class_path
      - type
      - cluster_id
      - capacity_gib
      - fee
      properties:
        service_class_path:
          $ref: '#/components/schemas/ServiceClassPath'
        type:
          $ref: '#/components/schemas/model.PlanType'
        cluster_id:
          type: string
          example: isk01
        capacity_gib:
          type: integer
          example: 20000
        fee:
          type: object
          required:
          - for_month
          - monthly
          - daily
          - hourly
          description: Fee information (tax included)
          properties:
            for_month:
              type: integer
              example: 1980
            monthly:
              type: integer
              example: 7200
            daily:
              type: integer
              example: 360
            hourly:
              type: integer
              example: 36
    ServiceClassPath:
      type: string
      description: >-
        Plan identifier (service class path).
        Attributes such as capacity are resolved by the server based on this value.
      example: "objectstorage/arc02/bucket/2t"
    BucketUsage:
      description: Bucket usage
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - num_objects_per_bucket
          - amount_gib_per_bucket
          properties:
            num_objects_per_bucket:
              type: integer
              example: 10000000
            amount_gib_per_bucket:
              type: number
              format: float
              example: 10240
    BucketListResponseBody:
      type: object
      required:
      - name
      - resource_id
      properties:
        name:
          allOf:
            - $ref: '#/components/schemas/BucketName'
        resource_id:
          allOf:
            - $ref: '#/components/schemas/ResourceID'
        plan:
          type: object
          properties:
            type:
              $ref: '#/components/schemas/model.PlanType'
            service_class_path:
              $ref: '#/components/schemas/ServiceClassPath'
    BucketResponseBody:
      allOf:
      - $ref: '#/components/schemas/model.Bucket'
      - type: object
        required:
        - cluster_id
        - name
        - plan
        properties:
          plan:
            $ref: '#/components/schemas/BucketPlanResponseBody'
    BucketPlanResponseBody:
      type: object
      required:
      - type
      - service_class_path
      properties:
        type:
          $ref: '#/components/schemas/model.PlanType'
        service_class_path:
          $ref: '#/components/schemas/ServiceClassPath'
    PermissionKeyReadResponseBody:
      type: object
      required:
      - id
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/PermissionKeyID'
        created_at:
          $ref: '#/components/schemas/CreatedAt'
    PermissionKeyCreateResponseBody:
      allOf:
      - $ref: '#/components/schemas/PermissionKey'
      - type: object
        required:
        - id
        - secret
        - created_at
    BucketPenalty:
      description: Bucket penalty
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - num_objects_per_bucket
          - amount_gib_per_bucket
          properties:
            num_objects_per_bucket:
              type: object
              required:
              - val
              - quota
              - is_applied
              properties:
                val:
                  type: integer
                  example: 10002495
                quota:
                  type: integer
                  example: 10000000
                is_applied:
                  type: boolean
            amount_gib_per_bucket:
              type: object
              required:
              - val
              - quota
              - is_applied
              properties:
                val:
                  type: number
                  format: float
                  example: 614.25366
                quota:
                  type: number
                  format: float
                  example: 10240
                is_applied:
                  type: boolean
                  example: true
    BucketQuota:
      description: Bucket quota
      type: object
      required:
      - data
      properties:
        data:
          description: data type
          type: object
          required:
          - num_objects_per_bucket
          - amount_gib_per_bucket
          properties:
            num_objects_per_bucket:
              type: integer
              example: 10000000
            amount_gib_per_bucket:
              type: number
              format: float
              example: 10240
    Quota:
      description: Quota
      type: object
      required:
      - data
      properties:
        data:
          description: data type
          type: object
          required:
          - num_root_keys
          - num_buckets
          - num_permissions
          - num_keys_per_permission
          - num_buckets_per_permission
          - num_objects_per_bucket
          - amount_gib_per_bucket
          properties:
            num_root_keys:
              type: integer
              example: 1
            num_buckets:
              type: integer
              example: 20
            num_permissions:
              type: integer
              example: 30
            num_keys_per_permission:
              type: integer
              example: 1
            num_buckets_per_permission:
              type: integer
              example: 20
            num_objects_per_bucket:
              type: integer
              example: 10000000
            amount_gib_per_bucket:
              type: number
              format: float
              example: 10240
    BucketBillingItemDetail:
      description: Charge information
      type: object
      required:
      - found
      - usage
      - charge
      - is_closing
      - from
      - to
      properties:
        found:
          type: boolean
          example: true
          description: Whether billing record was found or not. `false` means that bucket was not found, bucket was owned by other accounts, or error on metering.
        usage:
          # payment_contract_charge.usage
          type: number
          format: double
          example: 1100.0
          description: Usage for calculating charge
        charge:
          # payment_contract_charge.amount
          type: integer
          example: 456
          description: Amount billed including tax
        is_closing:
          type: boolean
          example: true
          description: Result of monthly closing or not
        from:
          type: string
          format: date
          example: '2022-08-01'
          description: The first day of metering range
        to:
          type: string
          format: date
          example: '2022-08-31'
          description: The last day of metering range
    BucketBillingItem:
      description: Bucket usage and charge for metering
      type: object
      required:
      - year_month
      - basic
      - storage_usage
      - num_objects
      - num_transactions
      - transfer_amount
      properties:
        year_month:
          type: string
          example: '2022-08'
          description: 集計対象の年月
        basic:
          $ref: '#/components/schemas/BucketBillingItemDetail'
          description: 基本料金
        storage_usage:
          $ref: '#/components/schemas/BucketBillingItemDetail'
          description: ストレージ使用量
        num_objects:
          $ref: '#/components/schemas/BucketBillingItemDetail'
          description: オブジェクト数
        num_transactions:
          $ref: '#/components/schemas/BucketBillingItemDetail'
          description: トランザクション数
        transfer_amount:
          $ref: '#/components/schemas/BucketBillingItemDetail'
          description: 転送量
    PermissionID:
      description: Permission ID
      type: integer
      format: int64
      example: 123
    ResourceID:
      description: Resource ID
      type: string
      pattern: '^\d{1,12}$'
      example: '123456789012'
    Code:
      description: Code
      type: string
      pattern: ^[\w@]+$
      example: abc01234@foo@isk01
    CreatedAt:
      description: Created at
      type: string
      format: date-time
      example: '2020-01-11T01:11:23.123456+09:00'
    BucketName:
      description: バケット名
      type: string
      minLength: 3
      maxLength: 64
      pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
      example: sample1-bucket
    CanRead:
      description: The flag to read bucket contents
      type: boolean
      example: true
    CanWrite:
      description: The flag to write bucket contents
      type: boolean
      example: true
    DisplayName:
      description: Display name
      type: string
      pattern: ^.+$
      example: abc012345-
