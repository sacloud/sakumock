    # 更新履歴

    - 2026-07-29 (v1.4.0): クラスタのロードバランサ設定取得・更新エンドポイントを追加
    - 2026-07-15 (v1.3.1): Response samplesを修正

    ---

    「AppRun専有型」が提供する API の利用方法とサンプルを公開しています。

    # 基本的な使い方

    ## APIキーの発行

    API を利用するには、認証用の「APIキー」が必要です。事前にキーを発行してください。\
    APIキーは、「ユーザーID」「パスワード」に相当する「トークン」と呼ばれる認証情報で構成されています。

    | 項目名 | APIキー発行時の項目名 | このドキュメント内での例 |
    |--------|----------------------|--------------------------|
    | ユーザーID | アクセストークン (UUID) | 01234567-89ab-cdef-0123-456789abcdef |
    | パスワード | アクセストークンシークレット | SAMPLETOKENSAMPLETOKENSAMPLETOKENSAM |

    ### 操作マニュアル

    [APIキー | さくらのクラウド ドキュメント](https://manual.sakura.ad.jp/cloud/api/apikey.html)

    ## APIエンドポイント

    `https://secure.sakura.ad.jp/cloud/api/apprun-dedicated/1.0/`

    ---
externalDocs:
  url: https://manual.sakura.ad.jp/cloud/apprun-dedicated/releasenote.html
  description: リリースノート | さくらのクラウド マニュアル
tags:
  - name: application
