name: OpenAPI drift

# Compares each service's openapi/ spec with the SAKURA Cloud API portal and
# keeps a single openapi-drift issue for all drift (see internal/openapidrift).
on:
  schedule:
    - cron: "0 1 * * 5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - name: Compare with the portal specs and sync issues
        run: go run ./internal/openapidrift -issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
